<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #e0e0e0;
      background: #1a1a2e;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2a2a4a;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }
    .version {
      font-size: 11px;
      color: #888;
      margin-left: auto;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding: 8px 10px;
      background: #16213e;
      border-radius: 8px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.green { background: #00c853; box-shadow: 0 0 6px #00c85388; }
    .dot.red { background: #ff1744; box-shadow: 0 0 6px #ff174488; }
    .dot.yellow { background: #ffc107; box-shadow: 0 0 6px #ffc10788; }
    .label { color: #aaa; }
    .value { margin-left: auto; font-weight: 500; color: #fff; }
    .job-info {
      background: #16213e;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
    }
    .job-info .title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 6px;
    }
    .job-info .detail {
      color: #fff;
      font-size: 13px;
    }
    .idle {
      color: #666;
      font-style: italic;
      text-align: center;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Browser Automation Bridge</h1>
    <span class="version" id="ver">v1.0.0</span>
  </div>

  <div class="status-row">
    <div class="dot" id="ws-dot"></div>
    <span class="label">Bridge</span>
    <span class="value" id="ws-status">---</span>
  </div>

  <div id="job-section">
    <div class="idle" id="idle-msg">Waiting for jobs...</div>
    <div class="job-info" id="job-card" style="display:none;">
      <div class="title">Current Job</div>
      <div class="detail" id="job-detail"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
